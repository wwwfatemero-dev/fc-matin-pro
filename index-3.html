<script>

{n:'لیورپول',short:'LIV',c:'#c8102e',k:'#f5f5f5',r:1.02,style:'red',players:['آلیسون','ویرجیل فن دایک','ترنت الکساندر آرنولد','الکسیس مک آلیستر','دومینیک سوبوسلای','محمد صلاح','کودی خاکپو']},
{n:'بایرن مونیخ',short:'FCB',c:'#d71920',k:'#fff',r:1.05,style:'stripes',players:['مانوئل نویر','دایو اوپامکانو','کیم مین جائه','جاشوا کیمیش','جمال موسیالا','هری کین','لروی سانه']},
{n:'پاری‌سن‌ژرمن',short:'PSG',c:'#17305f',k:'#e94b67',r:1.01,style:'center',players:['جانلوئیجی دوناروما','مارکینیوش','اشرف حکیمی','ویتینیا','ژوائو نوس','عثمان دمبله','خویچا کواراتسخلیا']},
{n:'آرسنال',short:'ARS',c:'#db102b',k:'#f4f4f4',r:1.02,style:'sleeves',players:['دیوید رایا','ویلیام سالیبا','گابریل ماگالائس','دکلان رایس','مارتین اودگارد','بوکایو ساکا','گابریل مارتینلی']},
{n:'اتلتیکو مادرید',short:'ATM',c:'#c71d35',k:'#f5f5f5',r:1.0,style:'stripes',players:['یان اوبلاک','خوزه خیمنز','مارکوس یورنته','کوکه','رودریگو دی‌پائول','آنتوان گریزمان','جولیان آلوارز']}
];
let crowd=.25,mg,nb,ab,mutd=false;let gv=null,gspr=false,gp0=0,gp1=0,gp2=0;const coarse=matchMedia('(pointer:coarse)').matches;
let ut=0,ot=1,spr=false,stam=1,tk=0,tcd=0,cam={x:500,y:300};
let W,H,port,S,T=[],ball,score=[0,0],time=0,state='menu',diff=.93,cur=null,msgT=0,msg='',charging=false,charge=0,ac,lastKicker=null;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;port=false;S=port?Math.min(W/(PH+70),H/(PW+110)):Math.min(W/(PW+110),H/(PH+70))}
addEventListener('resize',rs);rs();
function beep(f,d,ty){if(!ac)return;try{const o=ac.createOscillator(),v=ac.createGain();o.type=ty||'square';o.frequency.value=f;v.gain.value=.05;v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(v);v.connect(mg||ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function build(){const hm0=[[28,300],[170,150],[170,450],[300,120],[300,300],[300,480],[450,300]],hm=hm0.map(q=>[q[0]*1.8,q[1]*1.8]),NN=[1,3,5,7,8,9,10],SP=[.9,.95,.95,1,1,1.05,1.06],SH=[.9,.85,.85,1,1,1.1,1.15];T=[];
for(let t=0;t<2;t++){const k=t?ot:ut,C=CL[k];hm.forEach((h,i)=>T.push({t,i,gk:i==0,name:(C.players&&C.players[i])||NM[(k*7+i*3)%NM.length],num:([1,2,4,8,5,7,9][i]),kit:C.style||'plain',badge:C.short||'MF',spd:SP[i]*(.95+.05*C.r),sht:SH[i],c:i?C.c:C.k,hx:t?PW-h[0]:h[0],hy:h[1],x:0,y:0,vx:0,vy:0,fx:1,fy:0,cd:0,th:0}))}
ball={x:0,y:0,vx:0,vy:0,z:0,vz:0,rot:0,ax:0,ay:0,h:null,ht:0}}
function layout(){T.forEach(p=>{p.x=p.hx;p.y=p.hy;p.vx=p.vy=0;p.fx=p.t?-1:1;p.fy=0;p.cd=0;p.th=0});
ball.x=PW/2;ball.y=PH/2;ball.vx=ball.vy=0;ball.z=ball.vz=0;ball.h=null;cur=T[6];state='ready';msgT=1.1;msg='آماده!';charging=false;stam=1;tk=0;tcd=0}

/* input */
const keys={};let joy=null,jx=0,jy=0;
addEventListener('keydown',e=>{if(e.repeat)return;keys[e.key]=1;if(e.key===' '){e.preventDefault();startCharge()}if(e.key==='x'||e.key==='X')doPass();if(e.key==='Shift')spr=true;if(e.key==='z'||e.key==='Z')doTackle()});
addEventListener('keyup',e=>{keys[e.key]=0;if(e.key===' ')releaseShot();if(e.key==='Shift')spr=false});
cv.addEventListener('pointerdown',e=>{if(!joy&&e.clientX<W*.55){joy={id:e.pointerId,ox:e.clientX,oy:e.clientY};jx=jy=0;cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',e=>{if(joy&&joy.id===e.pointerId){let x=(e.clientX-joy.ox)/55,y=(e.clientY-joy.oy)/55;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}jx=x;jy=y}});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>{if(joy&&joy.id===e.pointerId){joy=null;jx=jy=0}}));
const bs=$('bs'),bp=$('bp'),bl=$('bl'),br=$('br'),bt=$('bt');
function defendingMode(){return !!(ball&&ball.h&&ball.h.t===1)}
function setControlsMode(){const d=defendingMode();br.textContent=d?'فشار':'دویدن';bl.textContent=d?'تعویض':'پاس بلند';bs.textContent=d?'تکل':'شوت';bp.textContent=d?'قطع توپ':'پاس';br.setAttribute('aria-label',d?'فشار روی حریف':'دویدن');bl.setAttribute('aria-label',d?'تعویض مدافع':'پاس بلند');bs.setAttribute('aria-label',d?'تکل':'شوت');bp.setAttribute('aria-label',d?'قطع توپ':'پاس کوتاه');}
bs.addEventListener('pointerdown',e=>{e.preventDefault();bs.classList.add('on');if(defendingMode())doTackle();else startCharge()});
['pointerup','pointercancel'].forEach(t=>bs.addEventListener(t,()=>{bs.classList.remove('on');if(!defendingMode())releaseShot()}));
bp.addEventListener('pointerdown',e=>{e.preventDefault();bp.classList.add('on');if(defendingMode())interceptBall();else doPass()});
['pointerup','pointercancel'].forEach(t=>bp.addEventListener(t,()=>bp.classList.remove('on')));
bl.addEventListener('pointerdown',e=>{e.preventDefault();bl.classList.add('on');if(defendingMode())switchDefender();else doLongPass()});
['pointerup','pointercancel'].forEach(t=>bl.addEventListener(t,()=>bl.classList.remove('on')));
br.addEventListener('pointerdown',e=>{e.preventDefault();spr=true;br.classList.add('on');if(defendingMode())interceptBall()});
['pointerup','pointercancel'].forEach(t=>br.addEventListener(t,()=>{spr=false;br.classList.remove('on')}));
function switchDefender(){if(state!=='play')return;const ds=T.filter(p=>p.t===0&&!p.gk).sort((a,b)=>dist(a,ball)-dist(b,ball));if(ds.length){cur=ds[0];msg='مدافع انتخاب شد: '+cur.name;msgT=.8}}
function interceptBall(){if(state!=='play'||!cur)return;const ds=T.filter(p=>p.t===0&&!p.gk).sort((a,b)=>dist(a,ball)-dist(b,ball));if(ds.length){cur=ds[0];const d=dist(cur,ball);if(d<R+BR+22&&tcd<=0){tk=.2;tcd=.65}}}
function doTackle(){if(state==='play'&&cur&&tcd<=0&&ball.h!==cur){tk=.34;tcd=.75;beep(170,.07)}}
function iv(){let sx=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0),sy=(keys.ArrowDown||keys.s||keys.S?1:0)-(keys.ArrowUp||keys.w||keys.W?1:0);
if(!sx&&!sy){const m=Math.hypot(jx,jy);if(joy&&m>.12){const k=Math.min(1,(m-.12)/.88);sx=jx/m*k;sy=jy/m*k}else if(gv){sx=gv.x;sy=gv.y}}
let x=port?sy:sx,y=port?-sx:sy;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}return{x,y}}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function startCharge(){if(state==='play'){charging=true;charge=0}}
function reach(p){return dist(p,ball)<R+BR+14}
function assistedGoalPoint(p){
 // Assisted shooting: aim automatically at the opponent's goal, preferring the side away from the goalkeeper.
 const gx=p.t?3:PW-3, keeper=T.find(q=>q.t!==p.t&&q.gk);
 const ys=[PH/2-GW*.43,PH/2+GW*.43,PH/2-GW*.34,PH/2+GW*.34,PH/2];
 let bestY=PH/2,bestScore=-1e9;
 for(const y of ys){
   const keeperDist=keeper?Math.hypot(gx-keeper.x,y-keeper.y):200;
   const centerPenalty=Math.abs(y-PH/2)*.012;
   const playerSideBonus=Math.abs(y-p.y)*.008;
   const score=keeperDist*1.25-centerPenalty-playerSideBonus;
   if(score>bestScore){bestScore=score;bestY=y}
 }
 return {x:gx,y:bestY};
}
function releaseShot(){if(!charging)return;charging=false;if(state!=='play'||!cur||!reach(cur))return;
 const target=assistedGoalPoint(cur);
 const dx=target.x-cur.x,dy=target.y-cur.y;
 const power=Math.min(980,(430+470*charge)*cur.sht);
 // Assisted aim plus varied elevation: quick taps can be driven shots, longer holds create higher chips/lobs.
 const lift=58+charge*105+(Math.random()<.22?28:0);
 kick(cur,dx,dy,power,lift);
 msg=charge>.62?'🚀 شوت هوایی کمکی':'🎯 شوت کمکی';msgT=.65;
}
function doLongPass(){if(state!=='play'||!cur||!reach(cur))return;const v=iv();let best=null,scoreBest=-1e9;
T.forEach(m=>{if(m.t||m.gk||m===cur)return;const dx=m.x-cur.x,dy=m.y-cur.y,d=Math.hypot(dx,dy),forward=dx*cur.fx+dy*cur.fy;if(forward>80&&d>100){const sc=forward-d*.22-Math.abs(dy)*.12;if(sc>scoreBest){scoreBest=sc;best=m}}});
if(best)kick(cur,best.x-cur.x,best.y-cur.y,Math.min(820,430+dist(best,cur)*.35),Math.min(310,dist(best,cur)*.25));else kick(cur,v.x||cur.fx,v.y||cur.fy,650,260)}
function doPass(){if(state!=='play'||!cur||!reach(cur))return;const v=iv(),dx=v.x||cur.fx,dy=v.y||cur.fy;let best=null,bsr=-9;
T.forEach(m=>{if(m.t||m.gk||m===cur)return;const ex=m.x-cur.x,ey=m.y-cur.y,d=Math.hypot(ex,ey),c=(ex*dx+ey*dy)/d;if(c>.6){const s=c*2-d/700;if(s>bsr){bsr=s;best=m}}});
if(best){const d=dist(best,cur);kick(cur,best.x+best.vx*.3-cur.x,best.y+best.vy*.3-cur.y,Math.min(640,170+d*1.3),d>520?240:0)}else kick(cur,dx,dy,320)}
function kick(p,dx,dy,sp,lf){lastKicker=p;sp*=1.3;const n=Math.hypot(dx,dy)||1;dx/=n;dy/=n;ball.vx=dx*sp;ball.vy=dy*sp;ball.vz=lf||0;ball.z=0;ball.h=null;p.cd=.35;
ball.x=p.x+dx*(R+BR+3);ball.y=p.y+dy*(R+BR+3);p.fx=dx;p.fy=dy;thud(sp/900)}
/* movement & AI */
function face(p){const s=Math.hypot(p.vx,p.vy);if(s>25){p.fx=p.vx/s;p.fy=p.vy/s}}
function mv(p,tx,ty,m,base){const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy),s=base*1.25*m*p.spd*Math.min(1,d/25);
p.vx+=((d>1?dx/d*s:0)-p.vx)*.2;p.vy+=((d>1?dy/d*s:0)-p.vy)*.2;face(p)}
function hold(p,dt){const gx=p.t?0:PW,gy=PH/2,dg=Math.hypot(gx-p.x,gy-p.y);let ty=gy,press=false;
T.forEach(o=>{if(o.t===p.t)return;const d=dist(o,p);if(d<150&&(o.x-p.x)*(gx-p.x)>0)ty+=(p.y>o.y?1:-1)*200;if(d<45)press=true});
mv(p,gx,Math.max(30,Math.min(PH-30,ty)),p.t?diff:.97,185);p.th-=dt;
if(p.th<=0){p.th=.2+Math.random()*.2;
